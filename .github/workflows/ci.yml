name: Frontend CI

on:
  push:
    branches: [main, develop, prepro]
  pull_request:
    branches: [main, develop, prepro]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0 || true

      - name: Run tests
        # jest.config.ts, jest.setup.tsx and src/__tests__ are tracked in git and
        # run for real here. jest-config v30 only loads a TypeScript config
        # natively on Node >= 22.6 (process.features.typescript); below that it
        # falls back to ts-node, which is not a dependency, so the config would
        # fail to load before a single test runs. Node 22 above covers this.
        #
        # e2e-capture/ holds Playwright specs, which Jest must not try to load.
        # jest.config.ts already ignores them, but the explicit flag here
        # REPLACES the default ignore list, hence /node_modules/ is repeated.
        run: >-
          npm test --
          --passWithNoTests --forceExit --ci
          --testPathIgnorePatterns=/node_modules/
          --testPathIgnorePatterns=/e2e-capture/
        env:
          CI: true
